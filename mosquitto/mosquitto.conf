# nextWireless M1 development broker: TLS/authentication only.
listener 8883 0.0.0.0
protocol mqtt
allow_anonymous false
password_file /mosquitto/data/security/passwords
acl_file /mosquitto/config/acl
cafile /mosquitto/data/security/certs/ca.crt
certfile /mosquitto/data/security/certs/server.crt
keyfile /mosquitto/data/security/certs/server.key
tls_version tlsv1.2
require_certificate false
persistence true
persistence_location /mosquitto/data/
autosave_interval 30
log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
