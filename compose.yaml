# Separate Docker Compose project: does not overwrite the original MariaDB stack.
name: nextwireless-dev2-pg

x-app-build: &app-build
  context: .
  dockerfile: app/Dockerfile

services:
  postgres:
    image: timescale/timescaledb:2.30.2-pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: nextwireless
      POSTGRES_USER: nw_user
      POSTGRES_PASSWORD: ${PG_PASSWORD:?Create .env from .env.example and set PG_PASSWORD}
      TZ: UTC
    # ports:
#   - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nw_user -d nextwireless"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 25s

  mqtt:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    env_file:
      - ./.secrets/mqtt-broker.env
    ports:
      # Safe default is loopback. Set MQTT_BIND_IP to the confirmed LAN address
      # only while following docs/hardware/MQTT_LAN.md and after applying its firewall rule.
      - "${MQTT_BIND_IP:-127.0.0.1}:8883:8883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/acl:/mosquitto/config/acl:ro
      - ./mosquitto/start-secure.sh:/mosquitto/config/start-secure.sh:ro
      - ./mosquitto/certs:/mosquitto/certs-src:ro
      - mqtt_data:/mosquitto/data
    entrypoint: ["/bin/sh", "/mosquitto/config/start-secure.sh"]
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h localhost -p 8883 --cafile /mosquitto/data/security/certs/ca.crt -u data-plane -P \"$$MQTT_DATA_PLANE_PASSWORD\" -t nw/internal/health -m ok -q 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  data-plane:
    build: *app-build
    restart: unless-stopped
    env_file:
      - ./.secrets/mqtt-data-plane.env
    environment: &runtime_env
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: nextwireless
      DB_USER: nw_user
      DB_PASSWORD: ${PG_PASSWORD:?Set PG_PASSWORD in .env}
      MQTT_HOST: mqtt
      MQTT_PORT: "8883"
      MQTT_CA_FILE: /run/mqtt/ca.crt
      MQTT_TLS_MIN_VERSION: "1.2"
    volumes:
      - ./mosquitto/certs/ca.crt:/run/mqtt/ca.crt:ro
      - ./db/migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
      mqtt:
        condition: service_healthy
    command: ["sh", "-c", "python migrate.py && exec python -u ingestor.py"]

  data-api:
    build: *app-build
    restart: unless-stopped
    environment:
      <<: *runtime_env
      DP_INBOUND_TOKEN: ${DP_INBOUND_TOKEN:?Set DP_INBOUND_TOKEN to a private service token}
      DP_INBOUND_ALLOWED_ORGS: ${DP_INBOUND_ALLOWED_ORGS:-demo,v13-test}
    ports:
      - "${DATA_API_BIND_IP:-127.0.0.1}:8002:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["uvicorn", "api:app", "--host", "0.0.0.0", "--port", "8000"]

  # Optional office/lab TLS termination. It is profile-gated and requires the
  # operator to provide certificate paths; plain HTTP remains loopback-only.
  data-api-tls:
    profiles: ["api-tls"]
    image: nginx:1.27-alpine
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    ports:
      - "${DATA_API_TLS_BIND_IP:-127.0.0.1}:${DATA_API_TLS_PORT:-8443}:8443"
    volumes:
      - ./deploy/nginx/data-api-tls.conf:/etc/nginx/nginx.conf:ro
      - ${DATA_API_TLS_CERT_FILE:-./deploy/tls/SET_CERT_PATH}:/run/tls/server.crt:ro
      - ${DATA_API_TLS_KEY_FILE:-./deploy/tls/SET_KEY_PATH}:/run/tls/server.key:ro
    depends_on:
      data-api:
        condition: service_started

  # Development-only receiver. No traffic leaves the Compose network.
  mock-nextgrp:
    profiles: ["mock"]
    build: *app-build
    restart: unless-stopped
    environment:
      <<: *runtime_env
      MOCK_NEXTGRP_TOKEN: mock-development-token
    depends_on:
      postgres:
        condition: service_healthy
    command: ["uvicorn", "mock_nextgrp:app", "--host", "0.0.0.0", "--port", "8080"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10

  outbox-worker:
    build: *app-build
    profiles: ["outbound"]
    restart: unless-stopped
    environment:
      <<: *runtime_env
      OUTBOX_DELIVERY_ENABLED: ${OUTBOX_DELIVERY_ENABLED:-false}
      BRIDGE_MODE: ${BRIDGE_MODE:-mock}
      NEXTGRP_ALARM_URL: http://mock-nextgrp:8080/mock/v1/alarms
      BRIDGE_ALARM_URL: ${BRIDGE_ALARM_URL:-http://mock-nextgrp:8080/internal/events/alarm}
      BRIDGE_STATUS_URL: ${BRIDGE_STATUS_URL:-http://mock-nextgrp:8080/internal/events/status}
      BRIDGE_OUTBOUND_TOKEN: ${BRIDGE_OUTBOUND_TOKEN:-mock-development-token}
      BRIDGE_REQUIRE_202: "true"
      BRIDGE_ALLOW_INSECURE_HTTP: ${BRIDGE_ALLOW_INSECURE_HTTP:-true}
      BRIDGE_DELIVER_NOT_BEFORE: ${BRIDGE_DELIVER_NOT_BEFORE:-}
      OUTBOX_BACKOFF_BASE_SECONDS: "1"
      OUTBOX_BACKOFF_MAX_SECONDS: "60"
      OUTBOX_BACKOFF_JITTER: "0.2"
      OUTBOX_LEASE_SECONDS: "60"
      OUTBOX_METRICS_SECONDS: "30"
    depends_on:
      postgres:
        condition: service_healthy
      data-plane:
        condition: service_started
      mock-nextgrp:
        condition: service_healthy
        required: false
    command: ["python", "-u", "outbox_worker.py"]

  snapshot-worker:
    build: *app-build
    restart: unless-stopped
    environment:
      <<: *runtime_env
      BRIDGE_SNAPSHOT_URL: ${BRIDGE_SNAPSHOT_URL:-http://mock-nextgrp:8080/internal/snapshot}
      BRIDGE_SNAPSHOT_TOKEN: ${BRIDGE_SNAPSHOT_TOKEN:-mock-development-token}
      BRIDGE_ALLOW_INSECURE_MOCK: ${BRIDGE_ALLOW_INSECURE_HTTP:-true}
      BRIDGE_ALLOWED_ORGS: ${DP_INBOUND_ALLOWED_ORGS:-demo,v13-test}
      SNAPSHOT_INTERVAL_SECONDS: "300"
      DEV1_CONFIG_URL: ${DEV1_CONFIG_URL:-}
      DEV1_CONFIG_DEVICE_IDS: ${DEV1_CONFIG_DEVICE_IDS:-}
      DEV1_SITE_NAME: ${DEV1_SITE_NAME:-}
      DEV1_ALLOW_INSECURE_LAB: ${DEV1_ALLOW_INSECURE_LAB:-false}
    depends_on:
      postgres:
        condition: service_healthy
      data-plane:
        condition: service_started
      mock-nextgrp:
        condition: service_healthy
        required: false
    command: ["python", "-u", "snapshot_worker.py"]

  simulator:
    profiles: ["demo"]
    build: *app-build
    restart: unless-stopped
    env_file:
      - ./.secrets/mqtt-simulator.env
    environment:
      MQTT_HOST: mqtt
      MQTT_PORT: "8883"
      MQTT_CA_FILE: /run/mqtt/ca.crt
      MQTT_TLS_MIN_VERSION: "1.2"
      SIM_INTERVAL: "60"
      SIM_ORG_CODE: ${SIM_ORG_CODE:-demo}
      SIM_SITE_CODE: ${SIM_SITE_CODE:-demo-site}
      SIM_S1_DEVICE_ID: ${SIM_S1_DEVICE_ID:-TH-001}
      SIM_S6_DEVICE_ID: ${SIM_S6_DEVICE_ID:-DR-001}
    volumes:
      - ./mosquitto/certs/ca.crt:/run/mqtt/ca.crt:ro
    depends_on:
      data-plane:
        condition: service_started
      mqtt:
        condition: service_healthy
    command: ["python", "-u", "simulator.py"]

  mqtt-security-test:
    profiles: ["mqtt-test"]
    build: *app-build
    env_file:
      - ./.secrets/mqtt-data-plane.env
      - ./.secrets/mqtt-simulator.env
    environment:
      RUN_MQTT_TESTS: "1"
      MQTT_HOST: mqtt
      MQTT_PORT: "8883"
      MQTT_CA_FILE: /run/mqtt/ca.crt
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: nextwireless
      DB_USER: nw_user
      DB_PASSWORD: ${PG_PASSWORD:?Set PG_PASSWORD in .env}
    volumes:
      - ./mosquitto/certs/ca.crt:/run/mqtt/ca.crt:ro
    depends_on:
      mqtt:
        condition: service_healthy
      postgres:
        condition: service_healthy
      data-plane:
        condition: service_started
    command: ["python", "-m", "unittest", "-v", "tests.security.test_mqtt_security"]

volumes:
  postgres_data:
  mqtt_data:
