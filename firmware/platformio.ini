[platformio]
default_envs = sht31, reed_door

[esp32]
platform = espressif32@6.12.0
board = esp32dev
framework = espidf
monitor_speed = 115200
board_build.partitions = partitions.csv
build_flags =
    -std=gnu++17
    -D MQTT_MAX_INFLIGHT=3
    -D FW_VERSION=\"0.1.0\"
build_unflags = -std=gnu++11

[env:sht31]
platform = ${esp32.platform}
board = ${esp32.board}
framework = ${esp32.framework}
monitor_speed = ${esp32.monitor_speed}
board_build.partitions = ${esp32.board_build.partitions}
build_unflags = ${esp32.build_unflags}
build_flags =
    ${esp32.build_flags}
    -D DEFAULT_SENSOR_TYPE=\"sht31\"

[env:reed_door]
platform = ${esp32.platform}
board = ${esp32.board}
framework = ${esp32.framework}
monitor_speed = ${esp32.monitor_speed}
board_build.partitions = ${esp32.board_build.partitions}
build_unflags = ${esp32.build_unflags}
build_flags =
    ${esp32.build_flags}
    -D DEFAULT_SENSOR_TYPE=\"reed_door\"

[env:native]
platform = native
test_build_src = no
build_flags = -std=c++17
